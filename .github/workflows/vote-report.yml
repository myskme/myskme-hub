name: 民意传真科 · 每日计票报表

# 每天北京时间早上 6:10（UTC 22:10）拉一次计票，把快照与最新报表提交进仓库。
# 王老师随时打开 投票报表/最新.md 就是当前民意；git 历史就是完整时间线。
# 拉不到计票时任务红着失败（不写假快照）——红了是「今天没统计上」，不是数据丢了。
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vote-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 拉计票并生成报表
        run: node deploy/vote/report.mjs
      - name: 提交报表
        run: |
          git config user.name 'myskme-vote-bot'
          git config user.email 'actions@github.com'
          git add 投票报表
          if git diff --cached --quiet; then
            echo '计票与上次一致，无需提交。'
          else
            git commit -m "投票报表：$(TZ=Asia/Shanghai date +%F) 快照（自动生成）"
            git push
          fi
