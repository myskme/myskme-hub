name: MYSKME 主页 · 构建与人工发布

on:
  push:
    branches: [main]
    paths:
      - 'build_hub.py'
      - 'qrcode-generator.js'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'og-cover.png'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'icons/**'
      - 'assets/**'
      - 'banks/**'
      - 'daily/**'
      - 'listen/**'
      - 'write/**'
      - 'wall/**'
      - 'print/**'
      - 'deploy/homepage/**'
      # 品牌 API 网关：正本在 deploy/gateway/，改了它主页要重新构建；
      # 副本 match/edge-functions/ 也要盯着——它一旦被单独改动，构建会在一致性校验处失败，
      # 这正是我们想要的告警（两份分叉会让两个域名上的网关行为不一样）。
      - 'deploy/gateway/**'
      - 'match/edge-functions/**'
      - '.github/workflows/deploy-homepage.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '只构建，或确认发布到 myskme.com 生产环境'
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - production

permissions:
  contents: read

concurrency:
  group: myskme-homepage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 生成并校验 EdgeOne 发布包
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      data_only: ${{ steps.scope.outputs.data_only }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 需要历史才能判断这次推送改了哪些文件
          fetch-depth: 0

      # 题库数据（banks/）变更后如果不自动上线，myskme.com 上的书架就会比
      # GitHub Pages 那份旧——学生扫新卷子上的兑换码会找不到题库。
      # 所以只给「纯数据变更」开一条窄道自动发布；只要掺了任何其他文件，
      # 仍然必须人工确认，闸门不动。
      - name: 判断本次推送是否只动了题库数据
        id: scope
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          else
            base="$BEFORE"
          fi
          if [ -z "$base" ]; then
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "拿不到对比基点，按非数据变更处理（仍需人工确认）"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          echo "本次改动："; echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^banks/'; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "→ 纯题库数据变更，将自动发布生产环境"
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "→ 含非数据改动，仍需人工确认才发布"
          fi

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 从唯一数据源重新生成主页
        run: python3 build_hub.py

      - name: 确认生成结果已经提交
        run: |
          if ! git diff --exit-code -- index.html; then
            echo '::error title=主页生成结果未提交::build_hub.py 生成的 index.html 与仓库不一致，请先在本地重新生成并提交。'
            exit 1
          fi

      - name: 构建 EdgeOne ZIP
        run: node deploy/homepage/build-edgeone-homepage.mjs "$RUNNER_TEMP/myskme-homepage.zip"

      - name: 校验 ZIP 完整性并生成摘要
        run: |
          unzip -t "$RUNNER_TEMP/myskme-homepage.zip"
          shasum -a 256 "$RUNNER_TEMP/myskme-homepage.zip" | tee "$RUNNER_TEMP/myskme-homepage.zip.sha256"

      - name: 保存可下载发布包
        uses: actions/upload-artifact@v4
        with:
          name: myskme-homepage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myskme-homepage.zip
            ${{ runner.temp }}/myskme-homepage.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy-production:
    name: 发布生产环境（人工确认，或纯题库数据自动）
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.target == 'production') ||
        (github.event_name == 'push' && needs.build.outputs.data_only == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: myskme-homepage-production
      url: https://myskme.com/
    steps:
      - name: 检出仓库用于线上验收
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 下载本次构建产物
        uses: actions/download-artifact@v4
        with:
          name: myskme-homepage-${{ github.sha }}
          path: dist

      - name: 确认 EdgeOne 凭证已配置
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo '::error title=缺少 EdgeOne Token::请在 GitHub Actions Secret 中配置 EDGEONE_API_TOKEN。'
            exit 1
          fi

      - name: 发布到 myskme-homepage 生产环境
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: >-
          npx --yes edgeone@1.6.19 makers deploy dist/myskme-homepage.zip
          -n myskme-homepage
          -e production
          -t "$EDGEONE_API_TOKEN"

      - name: 验收正式域名、Manifest 与图标
        run: node deploy/homepage/verify-online-homepage.mjs
